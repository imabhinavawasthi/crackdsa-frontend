<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#certBg)"/>
  
  <!-- Outer Double Borders -->
  <rect x="25" y="25" width="1150" height="800" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="6"/>
  <rect x="42" y="42" width="1116" height="766" rx="12" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Corner Ornaments -->
  <path d="M 50 80 L 80 50 M 50 100 L 100 50 M 50 120 L 120 50" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 1150 80 L 1120 50 M 1150 100 L 1100 50 M 1150 120 L 1080 50" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 50 770 L 80 800 M 50 750 L 100 800 M 50 730 L 120 800" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 1150 770 L 1120 800 M 1150 750 L 1100 800 M 1150 730 L 1080 800" stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Logo & Header -->
  <g text-anchor="middle">
    <!-- Brand Logo Icon -->
    <rect x="585" y="80" width="8" height="24" rx="4" fill="#2563EB"/>
    <rect x="597" y="70" width="8" height="34" rx="4" fill="#38BDF8"/>
    <rect x="609" y="60" width="8" height="44" rx="4" fill="#1D4ED8"/>

    <text x="600" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="10" fill="#1E40AF">CRACKDSA ACADEMY</text>
    <text x="600" y="235" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#0F172A">Certificate of Completion</text>
    <text x="600" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#64748B">THIS IS OFFICIALLY PRESENTED TO</text>
    
    <!-- Recipient Name -->
    <text x="600" y="380" font-family="Georgia, serif" font-size="48" font-style="italic" font-weight="bold" fill="#1E293B">Your Name Here</text>
    <line x1="280" y1="410" x2="920" y2="410" stroke="#CBD5E1" stroke-width="2"/>
    
    <text x="600" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#475569">for successfully completing the rigorous curriculum and problem-solving benchmarks in</text>
    
    <!-- Course Title -->
    <text x="600" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#1D4ED8">Data Structures &amp; Algorithms [Beginner to Advanced]</text>
    
    <!-- Credential Details -->
    <text x="600" y="575" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1" fill="#64748B">VERIFIED CREDENTIAL ID: CDSA-DSA-2026-VERIFIED</text>
  </g>

  <!-- Signatures & Verification Seal -->
  <!-- Left Signature -->
  <g transform="translate(180, 640)">
    <path d="M 20 45 Q 60 10 90 35 T 160 30 T 220 40" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="0" y1="65" x2="250" y2="65" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="125" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Abhinav Awasthi</text>
    <text x="125" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Founder &amp; Lead Instructor</text>
  </g>

  <!-- Center Seal -->
  <g transform="translate(600, 690)">
    <circle cx="0" cy="0" r="54" fill="url(#sealGrad)" filter="drop-shadow(0px 4px 10px rgba(37,99,235,0.3))"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 3"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Stars -->
    <text x="0" y="-18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#FDE047">★ ★ ★</text>
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#ffffff">OFFICIAL</text>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#BAE6FD">VERIFIED</text>
  </g>

  <!-- Right Signature -->
  <g transform="translate(770, 640)">
    <path d="M 30 40 Q 70 20 120 40 T 180 25 T 230 35" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="0" y1="65" x2="250" y2="65" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="125" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Academic Board</text>
    <text x="125" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">CrackDSA Certification Council</text>
  </g>
</svg>
